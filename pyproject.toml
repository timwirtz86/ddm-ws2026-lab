[project]
name = "ddm-ws2026-lab"
version = "0.1.0"
description = "Data Driven Modelling (WS 2026): hands-on lab material for all lectures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
